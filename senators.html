<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philippine Senators</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: url("PinasBG.jpg") center center / cover no-repeat fixed;
        color: #f1f5f9;
      }

      .navbar .navbar-brand,
      .navbar .nav-link {
        color: #0b1220 !important;
        font-weight: 700;
      }
      .navbar .nav-link:hover {
        color: #111827 !important;
      }
      .navbar {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        border: 0;
        border-radius: 0;
        padding: 1rem 2rem;
        min-height: 72px;
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .navbar .navbar-brand {
        display: inline-flex;
        align-items: center;
        color: #f1f5f9;
        font-size: 1.5rem;
      }

      .senatorCard {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        transition: all 0.3s ease;
        border: none;
        overflow: hidden;
      }

      .senatorCard:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .senatorCard:hover .senatorImg {
        transform: scale(1.08);
      }

      .senatorImageWrapper {
        position: relative;
        overflow: hidden;
        height: 260px;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .senatorImg {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        transition: transform 0.3s ease;
        display: block;
      }

      .placeholderImg {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 3rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }

      .senatorCard .card-body {
        padding: 1.25rem;
        flex-grow: 1;
      }

      .senatorParty {
        font-size: 0.85rem;
        color: #6c757d;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      .senatorName {
        color: #1f2937;
        font-weight: 600;
        margin-bottom: 0.75rem;
        line-height: 1.3;
        font-size: 1rem;
      }

      h1 {
        color: white;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
      }

      .containerHeader {
        padding: 2rem 0;
      }

      .loadingState {
        text-align: center;
        padding: 4rem 2rem;
        color: white;
      }

      .placeholderImg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 3rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold text-decoration-none" href="insidejoke.html">
          <img src="Pinaslogo.jpg" alt="Talakayin Logo" class="me-2 rounded" style="width: 40px; height: 40px; object-fit: cover;">
          <span>Talakayin</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#regions">Regions</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#cities">Cities</a></li>
            <li class="nav-item"><a class="nav-link" href="senators.html">Senators</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="containerHeader">
      <div class="container">
        <h1 class="display-5 fw-bold">Twelve Philippine Senators of 2025 National Elections</h1>
      </div>
    </header>

    <main class="container pb-5">
      <div class="row g-4" id="senatorGrid">
        <div class="col-12">
          <div class="loadingState">
            <div class="spinner-border text-white mb-3" style="width: 3rem; height: 3rem;" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mb-0">Loading Philippine Senators...</p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      
      const senators = [
        { name: "Christopher Lawrence T. Go",party: "PDP", image: "https://senate.gov.ph/hq//uploads/temp/8017dc43-6f4a-4c74-a242-1865c09d970c.png"},
        { name: "Paolo Benigno Aquino IV",party: "KANP", image: "https://senate.gov.ph/hq//uploads/temp/863a1b50-b1f1-4d92-bbbf-66909b4fee0c.png"},
        { name: "Ronald M. dela Rosa",party: "PDP", image: "https://senate.gov.ph/hq//uploads/temp/80653c43-8461-4aa2-a8c5-1ea6f7f2682c.png"},
        { name: "Erwin T. Tulfo",party: "Lakas", image: "https://senate.gov.ph/hq//uploads/temp/e841352b-62da-4933-849e-052434a75931.png"},
        { name: "Francis Pangilinan",party: "Liberal", image: "https://senate.gov.ph/hq//uploads/temp/24507a6b-c2b0-491f-8d69-97f81286428a.png"},
        { name: "Rodante D. Marcoleta",party: "Independent", image: "https://senate.gov.ph/hq//uploads/temp/42980717-7daa-4127-b452-6ec183a07603.png"},
        { name: "Panfilo M. Lacson",party: "Independent", image: "https://senate.gov.ph/hq//uploads/temp/9d0fdf32-c099-4428-b7ce-de6f94a4dad6.png"},
        { name: "Vicente C. Sotto III",party: "NPC", image: "https://senate.gov.ph/hq//uploads/temp/d99f0900-236f-4b6d-a45c-c56a842d6cad.png"},
        { name: "Pia S. Cayetano",party: "Nacionalista", image: "https://senate.gov.ph/hq//uploads/temp/d9336dae-a4ba-4d7e-b94e-bd1da6d7715d.png"},
        { name: "Camille A. Villar",party: "Nacionalista", image: "https://senate.gov.ph/hq//uploads/temp/12b4fcb2-d3d8-4ad1-9d14-e35fb9f515f8.png"},
        { name: "Manuel M. Lapid", party: "NPC", image: "https://senate.gov.ph/hq//uploads/temp/28b528bd-a3c9-4033-805e-97992d261867.png"},
        { name: "Imee R. Marcos", party: "Nacionalista", image: "https://senate.gov.ph/hq//uploads/temp/54b384fa-a7b4-46a5-bb4f-432e9e0cebf5.png"},
      ];

      function createPlaceholder(initials) {
        return `
          <div class="placeholderImg" style="height: 220px;">
            ${initials}
          </div>
        `;
      }

      function getInitials(fullName) {
        return fullName
          .split(' ')
          .filter(Boolean)
          .map((word) => word[0].toUpperCase())
          .slice(0, 3)
          .join('');
      }

      function loadSenators() {
        const grid = document.getElementById('senatorGrid');
        
        // Remove loading
        const loadingState = grid.querySelector('.loadingState');
        if (loadingState) loadingState.remove();
        
        senators.forEach((senator) => {
          const initials = getInitials(senator.name);
          const col = document.createElement('div');
          col.className = 'col-xl-3 col-lg-4 col-md-6 col-sm-6';
          
          col.innerHTML = `
            <div class="card senatorCard h-100" data-senator="${senator.name}">
              <div class="senatorImageWrapper">
                <img src="${senator.image}" 
                     alt="${senator.name}" 
                     class="card-img-top senatorImg" 
                     style="display: none;" />
                ${createPlaceholder(initials)}
              </div>
              <div class="card-body d-flex flex-column">
                <p class="senatorParty">${senator.party}</p>
                <h6 class="card-title senatorName">${senator.name}</h6>
              </div>
            </div>
          `;
          
          // Try to load real image and replace placeholder if successful
          const img = col.querySelector('img');
          img.onload = function() {
            this.style.display = 'block';
            this.nextElementSibling.style.display = 'none';
          };
          img.onerror = function() {
            // Keep beautiful placeholder if image fails
            this.style.display = 'none';
          };
          
          grid.appendChild(col);
        });
      }

      // Load senators when page loads
      document.addEventListener('DOMContentLoaded', loadSenators);
    </script>
  </body>
</html>
