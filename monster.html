<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DnD</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-gold: #D4AF37;
      --secondary-gold: #B8860B;
      --dark-stone: #2C2C2C;
      --stone-gray: #4A4A4A;
      --parchment: #F5DEB3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-image: url('BG.jpg');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      font-family: 'Orbitron', monospace;
      color: var(--parchment);
      overflow-x: hidden;
      position: relative;
      padding-top: 76px; /* Fixed navbar height */
      min-height: 100vh;
    }

  
    .navbar {
      background: linear-gradient(135deg, rgba(12,12,12,0.95), rgba(26,26,46,0.95)) !important;
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--primary-gold);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
      padding: 0.5rem 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1030;
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-gold) !important;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      transition: all 0.3s ease;
    }

    .navbar-brand:hover {
      color: var(--secondary-gold) !important;
      transform: scale(1.05);
    }

    .navbar-nav .nav-link {
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      color: var(--parchment) !important;
      margin: 0 0.5rem;
      padding: 0.75rem 1.25rem !important;
      border-radius: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .navbar-nav .nav-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      transition: left 0.5s;
    }

    .navbar-nav .nav-link:hover::before {
      left: 100%;
    }

    .navbar-nav .nav-link:hover {
      color: var(--primary-gold) !important;
      background: rgba(212, 175, 55, 0.1);
      transform: translateY(-2px);
    }

    .navbar-toggler {
      border: 2px solid var(--primary-gold);
      border-radius: 8px;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
    }

    /* Animated background elements */
    .bgAnimation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.1;
    }

    .floatingParticle {
      position: absolute;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .mainTitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      background: linear-gradient(45deg, var(--primary-gold), #FFD700, var(--secondary-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
      text-align: center;
      margin-bottom: 2rem;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 20px var(--primary-gold)); }
      to { filter: drop-shadow(0 0 30px var(--primary-gold)); }
    }


    .loading i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      body {
        padding-top: 70px;
      }
      
      .navbar {
        padding: 0.25rem 0;
      }
      
      }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--dark-stone);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-gold);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary-gold);
    }
    .gameContainer {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      background: rgba(42, 42, 42, 0.9);
      border-radius: 20px;
      border: 2px solid var(--primary-gold);
      box-shadow: 
        0 0 50px rgba(212, 175, 55, 0.3),
        inset 0 0 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .gameContainer::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, transparent 40%, rgba(212, 175, 55, 0.1) 50%);
      animation: rotate 20s linear infinite;
      z-index: 0;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .gameContainer > * {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <i></i> Dragon's Lair
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="adventures.html">Adventures</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="spell.html">Spells</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="monster.html">Monsters</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Animated background -->
  <div class="bgAnimation">
    <div class="floatingParticle" style="left: 10%; animation-delay: 0s; font-size: 2rem;">⭐</div>
    <div class="floatingParticle" style="left: 20%; animation-delay: 2s; font-size: 1.5rem;">⚡</div>
    <div class="floatingParticle" style="left: 40%; animation-delay: 5s; font-size: 2.5rem;">🗡️</div>
    <div class="floatingParticle" style="left: 60%; animation-delay: 8s; font-size: 1.8rem;">💎</div>
    <div class="floatingParticle" style="left: 80%; animation-delay: 12s; font-size: 2rem;">🔥</div>
    <div class="floatingParticle" style="left: 90%; animation-delay: 15s; font-size: 1.2rem;">✨</div>
  </div>

  <div class="mainContent">
    <div class="container-fluid p-4">
      <div class="mainTitle">
        <i></i> Dragon's Lair
      </div>
      <div class="gameContainer">
        <div class="row g-3 justify-content-center mb-4">
          <div class="col-md-3 col-12">
            <button onclick="getJoke()" class="btn btnGame btnJoke w-100">
              <i class="fas fa-laugh"></i> Tavern Tale
            </button>
          </div>
          <div class="col-md-3 col-12">
            <button onclick="getSpell()" class="btn btnGame btnSpell w-100">
              <i class="fas fa-magic"></i> Arcane Spell
            </button>
          </div>
          <div class="col-md-3 col-12">
            <button onclick="getDungeonBeast()" class="btn btnGame btnMonster w-100">
              <i class="fas fa-skull"></i> Dungeon Beast
            </button>
          </div>
          <div class="col-md-3 col-12">
            <button onclick="getAttacker()" class="btn btnGame btnBattle w-100">
              <i class="fas fa-fist-raised"></i> Get Attacker
            </button>
          </div>
        </div>
      
      

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
 
  </script>
</body>
</html>
