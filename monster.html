<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>   
    /* Navbar Custom Styling */
    .navbar {
      background: linear-gradient(135deg, rgba(12,12,12,0.95), rgba(26,26,46,0.95)) !important;
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--primary-gold);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
      padding: 0.5rem 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1030;
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-gold) !important;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      transition: all 0.3s ease;
    }

    .navbar-brand:hover {
      color: var(--secondary-gold) !important;
      transform: scale(1.05);
    }

    .navbar-nav .nav-link {
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      color: var(--parchment) !important;
      margin: 0 0.5rem;
      padding: 0.75rem 1.25rem !important;
      border-radius: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .navbar-nav .nav-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      transition: left 0.5s;
    }

    .navbar-nav .nav-link:hover::before {
      left: 100%;
    }

    .navbar-nav .nav-link:hover {
      color: var(--primary-gold) !important;
      background: rgba(212, 175, 55, 0.1);
      transform: translateY(-2px);
    }

    .navbar-toggler {
      border: 2px solid var(--primary-gold);
      border-radius: 8px;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
    }
  </style>
  <body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <i class="fas fa-dragon"></i> Dragon's Lair
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Adventures</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Spells</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="monster.html">Monsters</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
